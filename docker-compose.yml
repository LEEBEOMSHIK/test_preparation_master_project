version: '3.9'

# Base compose — 단독 실행 금지.
# dev:  docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# prod: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# local DB only: docker-compose -f docker-compose.local.yml up -d

services:
  db:
    image: postgres:15-alpine
    container_name: tpmp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tpmp}
      POSTGRES_USER: ${DB_USERNAME:-tpmp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tpmp_local_pw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tpmp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tpmp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tpmp}
      DB_USERNAME: ${DB_USERNAME:-tpmp}
      DB_PASSWORD: ${DB_PASSWORD:-tpmp_local_pw}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_256bit_secret_in_production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      UPLOAD_PATH: /uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10MB}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not_configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not_configured}
      GOOGLE_OAUTH2_REDIRECT_URI: ${GOOGLE_OAUTH2_REDIRECT_URI:-https://not_configured/api/login/oauth2/code/google}
      OAUTH2_FRONTEND_REDIRECT_URI: ${OAUTH2_FRONTEND_REDIRECT_URI:-http://localhost/auth/oauth/callback}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      NOTION_REDIRECT_URI: ${NOTION_REDIRECT_URI:-http://localhost:8080/api/notion/callback}
      NOTION_SUCCESS_REDIRECT: ${NOTION_SUCCESS_REDIRECT:-}
      NOTION_FAILURE_REDIRECT: ${NOTION_FAILURE_REDIRECT:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-tpmp_local_token_key_change_me}
      TOKEN_ENCRYPTION_KEY_PREVIOUS: ${TOKEN_ENCRYPTION_KEY_PREVIOUS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-false}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tpmp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: tpmp-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  uploads:
