spring:
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tpmp}
    username: ${DB_USERNAME:tpmp}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not_configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not_configured}
            scope:
              - email
              - profile
            redirect-uri: ${GOOGLE_OAUTH2_REDIRECT_URI:http://localhost:8080/api/login/oauth2/code/google}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_FILE_SIZE:10MB}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

logging:
  file:
    name: ./logs/app.log
  level:
    root: INFO
    com.tpmp: INFO
    org.springframework.transaction: INFO

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900000
    refresh-token-expiry: 604800000
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    path: ${UPLOAD_PATH:./uploads}
  oauth2:
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000/auth/oauth/callback}
  ai:
    provider: ${AI_PROVIDER:anthropic}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
  notion:
    client-id: ${NOTION_CLIENT_ID:}
    client-secret: ${NOTION_CLIENT_SECRET:}
    redirect-uri: ${NOTION_REDIRECT_URI:http://localhost:8080/api/notion/callback}
    success-redirect: ${NOTION_SUCCESS_REDIRECT:http://localhost:3000/user/settings?notion=connected}
    failure-redirect: ${NOTION_FAILURE_REDIRECT:http://localhost:3000/user/settings?notion=failed}
  security:
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY}
    token-encryption-key-previous: ${TOKEN_ENCRYPTION_KEY_PREVIOUS:}
