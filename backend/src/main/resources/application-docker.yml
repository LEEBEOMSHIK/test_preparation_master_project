spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:tpmp}
    username: ${DB_USERNAME:tpmp}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not_configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not_configured}
            scope:
              - email
              - profile
            redirect-uri: ${GOOGLE_OAUTH2_REDIRECT_URI:https://not_configured/api/login/oauth2/code/google}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900000
    refresh-token-expiry: 604800000
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  upload:
    path: ${UPLOAD_PATH:/uploads}
  oauth2:
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost/auth/oauth/callback}
  ai:
    provider: ${AI_PROVIDER:anthropic}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}        # 기본값 없음 — 누락 시 기동 실패(fast-fail)
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
